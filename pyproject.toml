[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docconvert"
version = "0.1.0"
description = "LaTeX -> Word (.docx) pipeline for Russian GOST documents."
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.1",
    "lxml>=5.0",
    "PyYAML>=6.0",
    "pybtex>=0.24",
]

[project.scripts]
docconvert = "docconvert.cli:main"

[tool.setuptools.packages.find]
include = ["docconvert*"]

[tool.setuptools.package-data]
docconvert = ["../templates/*.yaml", "../templates/*.csl"]
